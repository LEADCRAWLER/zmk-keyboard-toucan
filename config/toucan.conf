# ============================================================
# TOUCAN Custom Configuration
# ============================================================

# --- Windows BLE Compatibility ---
# PHY 2Mbps deaktivieren — Realtek/Intel BLE-Treiber auf Windows
# verhandeln 2M, schaffen es aber nicht → Pairing scheitert.
# Mac/Linux: Kein Impact (1M ist BLE-Baseline)
CONFIG_BT_CTLR_PHY_2M=n

# GATT Notifications ohne Subscription erlauben.
# Windows subscribed Battery Service manchmal nicht → Tasten blockiert.
# Mac/Linux: Kein Impact
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Cirque Trackpad Power Management ---
# Device-Level PM (Dependency für PINNACLE_PM)
CONFIG_PM_DEVICE=y
CONFIG_PM_DEVICE_RUNTIME=y

# Pinnacle-Sensor: Shutdown bei System-Suspend (~0.23µA statt 2.9mA)
CONFIG_INPUT_PINNACLE_PM=y
# Pinnacle Sleep linked to ZMK idle state
CONFIG_ZMK_INPUT_PINNACLE_IDLE_SLEEPER=y

# --- Passkey Entry (FALLBACK — nur aktivieren wenn BLE-Fix nicht reicht) ---
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
