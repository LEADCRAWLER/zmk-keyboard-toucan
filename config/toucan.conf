# --- Windows BLE Compatibility ---
CONFIG_BT_CTLR_PHY_2M=n
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Cirque Trackpad Power Management ---
# PM_DEVICE enables suspend/resume callbacks (system sleep → trackpad shutdown)
# PM_DEVICE_RUNTIME deliberately NOT enabled — driver has no pm_device_runtime_get()
# consumer, so exclusive runtime PM would immediately suspend the trackpad after init.
CONFIG_PM_DEVICE=y
CONFIG_INPUT_PINNACLE_PM=y

# ZMK_INPUT_PINNACLE_IDLE_SLEEPER requires ZMK_MOUSE — omitted for now.
# Would link trackpad sleep to ZMK idle state.

# --- Passkey Entry (FALLBACK) ---
# CONFIG_ZMK_BLE_PASSKEY_ENTRY=y
